<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow">
  <title>Нет подключения к интернету — Бизнес. Маркетинг. Недвижимость.</title>
  <link rel="icon" type="image/png" href="https://cdn.poehali.dev/projects/4bce74f4-4dd7-424e-85e7-ff08f8399357/files/favicon-1780486766400.png">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      background: linear-gradient(160deg, hsl(215 85% 18%) 0%, hsl(215 85% 28%) 55%, hsl(215 85% 42%) 100%);
      color: #fff;
    }
    .wrap {
      min-height: 100%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 32px 20px;
    }
    .logo {
      width: 64px; height: 64px; border-radius: 16px;
      background: rgba(255,255,255,0.1);
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 24px;
    }
    .logo svg { width: 32px; height: 32px; }
    h1 {
      font-size: 22px; font-weight: 800; margin: 0 0 10px; max-width: 420px; line-height: 1.3;
    }
    p {
      font-size: 14px; color: rgba(255,255,255,0.75); margin: 0 0 28px; max-width: 380px; line-height: 1.6;
    }
    .badge {
      display: inline-flex; align-items: center; gap: 8px;
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.18);
      border-radius: 999px; padding: 8px 16px; font-size: 12px; color: rgba(255,255,255,0.8);
      margin-bottom: 28px;
    }
    .dot {
      width: 8px; height: 8px; border-radius: 50%; background: #f97316;
      animation: pulse 1.4s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }
    button {
      background: #f97316; color: #fff; border: none; border-radius: 12px;
      padding: 13px 28px; font-size: 14px; font-weight: 700; cursor: pointer;
      font-family: inherit; transition: opacity .2s;
    }
    button:hover { opacity: 0.9; }
    button:active { opacity: 0.75; }
    .status { margin-top: 16px; font-size: 12px; color: rgba(255,255,255,0.5); min-height: 16px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <path d="M9 22V12h6v10"/>
      </svg>
    </div>
    <div class="badge"><span class="dot"></span> Сайт работает в штатном режиме</div>
    <h1>Похоже, пропало интернет-соединение</h1>
    <p>Наш сайт работает исправно — проблема на стороне вашего интернет-подключения. Проверьте Wi-Fi или мобильные данные и повторите попытку.</p>
    <button onclick="retry()">Повторить попытку</button>
    <div class="status" id="status"></div>
  </div>

  <script>
    function retry() {
      var el = document.getElementById('status');
      el.textContent = 'Проверяем соединение…';
      fetch('/favicon.svg', { cache: 'no-store', mode: 'no-cors' })
        .then(function() { window.location.reload(); })
        .catch(function() { el.textContent = 'Соединение всё ещё недоступно. Попробуйте ещё раз.'; });
    }

    // Автопроверка каждые 5 секунд — как только сеть вернётся, страница перезагрузится сама
    setInterval(function() {
      if (navigator.onLine) {
        fetch('/favicon.svg', { cache: 'no-store', mode: 'no-cors' })
          .then(function() { window.location.reload(); })
          .catch(function() {});
      }
    }, 5000);

    window.addEventListener('online', function() {
      window.location.reload();
    });
  </script>
</body>
</html>
